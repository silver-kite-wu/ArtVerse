server:
  port: 8080

spring:
  datasource:
    # 三重保险：
    #   1. options=-c client_encoding=UTF8 → 建链时直接发 SET 命令
    #   2. charSet=UTF-8 → 通知驱动按 UTF-8 解读字节
    #   3. JVM file.encoding=UTF-8（由启动脚本 start-backend.ps1 设置）
    # 原因：PostgreSQL JDBC 42.7.x 在 Windows 上默认按 JVM 默认编码（GBK/CP1252）
    #      解读字节，导致双重 UTF-8 编码的中文以 Latin-1 形式读出。
    url: jdbc:postgresql://localhost:5432/manga_novel?ApplicationName=artverse&stringtype=unspecified&options=-c%20client_encoding%3DUTF8&charSet=UTF-8
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
  task:
    scheduling:
      pool:
        size: 4

artverse:
  secrets:
    encryption-key: ${ARTVERSE_SECRET_ENCRYPTION_KEY:ArtVerse!ApiKey1}
    active-key-version: 2
  auth:
    cookie:
      secure: ${ARTVERSE_AUTH_COOKIE_SECURE:false}
      refresh-body-fallback-enabled: true
      refresh-cookie-name: artverse-refresh
      refresh-token-timeout-seconds: 43200
    challenge:
      mode: ${ARTVERSE_AUTH_CHALLENGE_MODE:enforce}
      provider: graphic-captcha
      login-challenge-mode: always
      captcha-length: 4
      captcha-image-width: 160
      captcha-image-height: 50
      captcha-expire-seconds: 300
      captcha-font-size: 28
      captcha-interference-lines: 5
    risk:
      hmac-key: ${ARTVERSE_AUTH_RISK_HMAC_KEY:dev-auth-risk-hmac}
      login-failure-challenge-threshold: 3
      login-failure-window-seconds: 900
      login-ip-challenge-threshold: 20
      login-ip-hard-limit: 100
      login-ip-window-seconds: 300
      register-ip-limit: 10
      register-ip-window-seconds: 3600
      degraded-login-account-limit: 3
      degraded-login-ip-limit: 10
      degraded-login-account-window-seconds: 900
      degraded-login-ip-window-seconds: 300
    proxy:
      trusted-cidrs: []
    csrf:
      mode: report
      header-name: X-ArtVerse-Client
      header-value: web
  cors-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  storage:
    root: ./manga_outputs
  upload:
    max-image-bytes: 10485760
  import:
    max-zip-bytes: 524288000
    max-novel-chars: 50000
  character:
    max-chars: 20000
  ref:
    max-images-per-level: 4
  manga:
    default-image-count: 10
    allowed-image-counts:
      - 4
      - 6
      - 8
      - 10
      - 12
      - 15
      - 20
  manga-generation:
    max-concurrent-jobs: 4
  # 图像/LLM/工作流服务的 API Key 与 Base URL 均来自用户在设置页保存的
  # Provider 配置（数据库存储），此处不再提供任何运营方兜底凭据。
  coze:
    workflow-id: "7645642109203103763"
  flyway:
    auto-repair-checksum-mismatch: true
  minio:
    endpoint: http://localhost:9000
    bucket: artverse-manga
    region: us-east-1
    access-key: "minioadmin"
    secret-key: "minioadmin"
    secure: false
    public-base-url: ""
    presigned-url-expire-seconds: 3600
  rate-limit:
    # 限流默认值（可被 @RateLimit 注解覆盖）
    enabled: true
    default-window-seconds: 60
    default-max-requests: 30
  single-flight:
    # 幂等（单飞模式）默认值
    enabled: true
    default-ttl-seconds: 30
  agent:
    first-event-timeout-seconds: 90
    model-idle-timeout-seconds: 180
    tool-idle-timeout-seconds: 600
    run-watchdog-interval-ms: 30000
    max-concurrent-runs: 32
    max-concurrent-runs-per-user: 2
    budget-ttl-seconds: 86400
    router-max-model-calls: 2
    conversation-max-model-calls: 4
    conversation-max-tool-calls: 4
    storyboard-max-model-calls: 8
    storyboard-max-tool-calls: 6
    review-max-model-calls: 13
    review-max-tool-calls: 4
    director-max-model-calls: 12
    max-input-tokens: 60000
    max-output-tokens: 20000
    max-output-bytes: 160000
    max-subagents: 4
    rag-injection-enabled: true
    business-skills-enabled: true
    storyboard-two-phase-enabled: true
    multi-instance-event-bus-enabled: true
    outbox-worker-enabled: true
    outbox-batch-size: 8
    outbox-lease-seconds: 90
    outbox-max-attempts: 5
    provider-allow-http: false
    provider-allowed-private-cidrs: []
    auto-routing-enabled: true
    routing-shadow-mode: false
    routing-direct-threshold: 0.80
    routing-read-only-threshold: 0.55
    agent-cache-max-size: 256
    agent-cache-expire-after-minutes: 30
    max-retries: 2
    retry-min-backoff-ms: 1000
    retry-max-backoff-ms: 10000
    retry-multiplier: 2.0
    circuit-breaker-failure-threshold: 5
    circuit-breaker-wait-seconds: 30
    circuit-breaker-sliding-window-size: 20
    circuit-breaker-slow-call-threshold-ms: 120000

# Sa-Token 配置（替代 Spring Security + JWT）
sa-token:
  # === Token 基础配置 ===
  token-name: satoken
  timeout: 43200           # Token 硬过期（秒），12h
  active-timeout: 1800       # 活跃续期阈值（秒），30min 内有请求则自动续期
  is-concurrent: true      # 允许多端登录
  is-share: false          # 多端不共享 token
  token-style: uuid        # uuid / 32str / random
  token-prefix: ""         # 不加 Bearer 前缀
  is-read-cookie: true
  is-read-header: false
  is-write-cookie: true
  is-write-header: false
  is-log: true
  cookie:
    path: /
    http-only: true
    same-site: strict
    secure: ${ARTVERSE_AUTH_COOKIE_SECURE:false}

  # === 拦截器配置 ===
  intercept-urls:
    - /api/auth/login = no-auth
    - /api/auth/register = no-auth
    - /api/auth/refresh = no-auth
    - /static/** = no-auth
    - /actuator/health = no-auth
    - /api/** = auth

  # === Sa-Token Redis 集成 ===
  redis:
    is-read: true
    is-write: true

# === Actuator ===
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,circuitbreakers,retries
  endpoint:
    health:
      show-details: always
